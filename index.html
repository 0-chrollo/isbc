      <style>
nav {
  background:white;
  padding: 0 32px;
  display: flex;
  align-items: center;
  width: 100%;
  justify-content: space-between;
  height: 70px;
  position: fixed;
  z-index: 1000;
}

.logo {
  display: flex;
  align-items: center;
  gap: 10px;
}

.logo img {
  height: 4rem;
  width: auto;
  display: block;
}

.logo-title {
  font-size: 0.95rem;
  font-weight: 700;
  color:#538f3f;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.menu-toggle {
  display: flex;
  align-items: center;
  gap: 10px;
  background: none;
  border: none;
  cursor: pointer;
  font-size: 0.90rem;
  font-weight: 700;
  color: #5e954c;
  letter-spacing: 0.03em;
}

.menu-toggle .bars {
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.menu-toggle .bars span {
  display: block;
  width: 20px;
  height: 2.5px;
  background: #5fa349;
  transition: all 0.3s ease;
}

.menu-toggle.open .bars span:nth-child(1) {
  transform: translateY(7.5px) rotate(45deg);
}
.menu-toggle.open .bars span:nth-child(2) {
  opacity: 0;
}
.menu-toggle.open .bars span:nth-child(3) {
  transform: translateY(-7.5px) rotate(-45deg);
}

.nav-links {
  display: grid;
  grid-template-rows: 0fr;
  flex-direction: column;
  background: #ffffff;
  position: absolute;
  top: 70px;
  left: 0;
  right: 0;
  z-index: 100;
  opacity: 0;
  transition: grid-template-rows 0.4s cubic-bezier(0.4, 0, 0.2, 1),
              opacity 0.4s cubic-bezier(0.4, 0, 0.2, 1);
}

.nav-links > * {
  overflow: hidden;
}

.nav-links.open {
  grid-template-rows: 1fr;
  opacity: 1;
}

.nav-links a:not(.nav-cta) {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin: 0 28px;
  padding: 18px 0;
  color: #02162e;
  text-decoration: none;
  font-weight: 500;
  font-size: 0.80rem;
  border-bottom: 1px solid #e8e8e8;
  transition: color 0.2s;
}

.nav-links a:not(.nav-cta):last-of-type {
  border-bottom: none;
}

.nav-links a:not(.nav-cta):hover {
  color: #5e954c;
}

.nav-links a:not(.nav-cta):hover i {
  opacity: 1;
  color: #c0392b;
}

.nav-links a:not(.nav-cta) i {
  font-size: 0.9rem;
  color: #02162e;
  opacity: 0.4;
  transition: opacity 0.2s, color 0.2s;
}

.nav-cta-wrap {
  padding: 24px 28px;
  display: flex;
  justify-content: center;
}

.nav-cta {
  background: #5e954c;
  color: #ffffff !important;
  padding: 13px 32px !important;
  border-radius: 999px !important;
  font-size: 0.85rem !important;
  font-weight: 700 !important;
  text-decoration: none;
  border-bottom: none !important;
  transition: background 0.2s ease, transform 0.15s ease !important;
  display: inline-block;
}

.nav-cta:hover {
  background: #143908 !important;
  transform: scale(1.03);
}

@media (min-width: 768px) {
  .menu-toggle {
    display: none;
  }

  .nav-links {
  display: flex;
  flex-direction: column;
  background: #ffffff;
  position: absolute;
  top: 70px;
  left: 0;
  right: 0;
  z-index: 100;
  overflow: hidden;
  max-height: 0;
  opacity: 0;
  visibility: hidden;
  transition: max-height 0.45s cubic-bezier(0.4, 0, 0.2, 1),
              opacity 0.45s cubic-bezier(0.4, 0, 0.2, 1),
              visibility 0s linear 0.45s;
}

  .nav-links a:not(.nav-cta) {
    margin: 0;
    padding: 0 18px;
    color: #ffffff;
    border-bottom: none;
    font-size: 0.85rem;
  }

  .nav-links a:not(.nav-cta) i {
    display: none;
  }

  .nav-links a:not(.nav-cta):hover {
    color: #ffffff;
    opacity: 0.75;
  }

  .nav-cta-wrap {
    padding: 0 0 0 18px;
  }

  .nav-cta {
    padding: 10px 22px !important;
    font-size: 0.8rem !important;
  }
}
  
</style>




<script>

const toggle = document.getElementById('toggle');
const navLinks = document.getElementById('navLinks');

toggle.addEventListener('click', () => {
  toggle.classList.toggle('open');
  navLinks.classList.toggle('open');
});
</script>
